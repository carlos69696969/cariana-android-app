<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sin conexion</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            background: #030303;
        }

        .screen {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("cariana-no-internet.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .screen::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(to bottom, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.1) 38%, rgba(0, 0, 0, 0.46) 58%, rgba(0, 0, 0, 0.18));
            pointer-events: none;
        }

        .message {
            position: absolute;
            left: 50%;
            bottom: max(22px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            z-index: 1;
            width: min(88vw, 340px);
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
        }

        h1 {
            margin: 0 0 6px;
            font-size: clamp(22px, 7vw, 28px);
            line-height: 1.12;
            font-weight: 800;
            letter-spacing: 0;
        }

        p {
            margin: 0 auto;
            color: rgba(255, 255, 255, 0.82);
            font-size: 15px;
            line-height: 1.42;
        }

        button {
            margin-top: 16px;
            min-height: 48px;
            width: 100%;
            border: 0;
            border-radius: 999px;
            background: #ffffff;
            color: #111111;
            font-size: 15px;
            font-weight: 800;
            text-shadow: none;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
        }

        button:active {
            transform: translateY(1px);
        }

        @media (max-height: 720px) {
            .message {
                bottom: max(16px, env(safe-area-inset-bottom));
            }

            p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<main class="screen">
    <section class="message" aria-label="Sin conexion a internet">
        <h1>Sin conexion</h1>
        <p>Comprueba que estas conectado a Wi-Fi o tengas datos moviles.</p>
        <button type="button" onclick="window.location.reload()">REINTENTAR</button>
    </section>
</main>
</body>
</html>
