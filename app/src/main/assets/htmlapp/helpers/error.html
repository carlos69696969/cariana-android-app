<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sin conexion</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            background: #030303;
        }

        .screen {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("cariana-no-internet.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .screen::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(to bottom, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.1) 38%, rgba(0, 0, 0, 0.46) 58%, rgba(0, 0, 0, 0.18));
            pointer-events: none;
        }

        .message {
            position: absolute;
            left: 50%;
            top: 43%;
            transform: translateX(-50%);
            z-index: 1;
            width: min(86vw, 340px);
            padding: 18px 18px 16px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 22px;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.34);
            backdrop-filter: blur(8px);
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(22px, 7vw, 30px);
            line-height: 1.12;
            font-weight: 800;
            letter-spacing: 0;
        }

        p {
            margin: 0 auto;
            color: rgba(255, 255, 255, 0.82);
            font-size: 15px;
            line-height: 1.42;
        }

        button {
            margin-top: 16px;
            min-height: 44px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.92);
            color: #111111;
            font-size: 15px;
            font-weight: 800;
        }

        button:active {
            transform: translateY(1px);
        }

        @media (max-height: 720px) {
            .message {
                top: 39%;
                padding: 15px;
            }

            p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<main class="screen">
    <section class="message" aria-label="Sin conexion a internet">
        <h1>Ups, parece que no tienes internet</h1>
        <p>Revisa que tu telefono tenga Wi-Fi o datos moviles. La app intentara reconectarse automaticamente.</p>
        <button type="button" onclick="window.location.reload()">Reintentar</button>
    </section>
</main>
</body>
</html>
